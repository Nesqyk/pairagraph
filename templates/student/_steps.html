<ol class="reading-steps" aria-label="Reading journey">{% for label in ['Read your story','A little reflection','Your next chapter'] %}<li class="{{ 'active' if stage==loop.index else 'done' if stage>loop.index else '' }}" {% if stage==loop.index %}aria-current="step"{% endif %}><span>{{ '✓' if stage>loop.index else '%02d'|format(loop.index) }}</span>{{ label }}</li>{% endfor %}</ol>
