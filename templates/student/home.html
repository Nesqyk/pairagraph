{% extends 'student/base.html' %}{% block title %}Start reading{% endblock %}
{% block content %}
<section class="simple-hero">
<div class="hero-designs" aria-hidden="true">
<span class="hero-design design-book">{{ icon('book') }}</span>
<span class="hero-design design-leaf">{{ icon('leaf') }}</span>
<span class="hero-design design-spark">{{ icon('spark') }}</span>
<span class="hero-design design-mic">{{ icon('mic') }}</span>
</div>

<h1>Let’s read!</h1>
<p>Read a story out loud.</p>
<form method="post" action="{{ url_for('student_start') }}">{{ csrf() }}
<input type="hidden" name="learner_id" value="{{ learner.id if learner else '' }}">
<button class="button primary large" {% if not learner or not featured %}disabled{% endif %}>{{ icon('book') }} Start Reading {{ icon('arrow') }}</button>
</form>

</section>
{% endblock %}
